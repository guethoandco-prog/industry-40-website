backend:
  name: github
  repo: guethoandco-prog/industry-40-website
  branch: main
  # Ces lignes permettent d'utiliser l'authentification GitHub native sans Netlify Identity
  base_url: https://industry50.netlify.app
  auth_endpoint: auth

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages du site"
    files:
      - file: "src/content/accueil.json"
        label: "Page d'accueil"
        name: "accueil"
        fields:
          - {label: "Titre principal", name: "title", widget: "string"}
          - {label: "Sous-titre", name: "subtitle", widget: "text"}
